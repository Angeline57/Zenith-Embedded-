<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Login - Zenith Sleep</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <div class="brand">
          <img class="brand__logo" src="../zenith_sleep_logo_design.png" alt="Zenith Sleep logo" />
          <span class="brand__name">Zenith Sleep</span>
        </div>
        <div class="topbar__cta">
          <a class="btn btn--light" href="index.html">Back to site</a>
        </div>
      </div>
    </header>

    <main class="auth">
      <div class="container auth__grid">
        <div class="auth__copy">
          <p class="eyebrow">Secure access</p>
          <h1>Welcome back</h1>
          <p class="lead">
            Log in to view your patient dashboard and weekly/monthly sleepwalking
            trends.
          </p>
        </div>
        <form class="auth__card" id="loginForm">
          <label class="auth__label">I am a</label>
          <div class="auth__role">
            <label class="auth__option">
              <input type="radio" name="role" value="doctor" required />
              Doctor
            </label>
            <label class="auth__option">
              <input type="radio" name="role" value="user" />
              User
            </label>
          </div>

          <label class="auth__label" for="email">Email</label>
          <input class="auth__input" id="email" name="email" type="email" required />

          <label class="auth__label" for="password">Password</label>
          <input
            class="auth__input"
            id="password"
            name="password"
            type="password"
            required
          />

          <button class="btn btn--dark auth__submit" type="submit">Sign in</button>
          <p class="auth__footnote">
            Demo only. Authentication will be connected to backend services.
          </p>
        </form>
      </div>
    </main>
    <script>
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const role = document.querySelector('input[name="role"]:checked')?.value;
        if (role === "doctor") {
          window.location.href = "doctor_dashboard.html";
        } else {
          window.location.href = "user_dashboard.html";
        }
      });
    </script>
  </body>
</html>
